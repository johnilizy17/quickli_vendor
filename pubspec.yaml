name: quickli_vendor
description: "Quickli Vendor App — manage your store, orders, menu and earnings."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_screenutil: ^5.9.3
  get: ^4.7.3
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  get_storage: ^2.1.1
  dio: ^5.11.0
  intl: ^0.20.3
  image_picker: ^1.2.3
  image_cropper: ^11.0.0
  file_picker: ^8.1.4
  permission_handler: ^12.0.3
  shimmer: ^3.0.0
  oktoast: ^3.4.0
  url_launcher: ^6.3.2
  socket_io_client: ^3.1.6
  geolocator: 14.0.2
  cached_network_image: ^3.4.1
  fl_chart: ^0.70.2
  pinput: ^6.0.2
  equatable: ^2.1.0
  uuid: ^4.6.0
  iconsax_plus: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "asset/img/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - asset/img/
    - asset/svg/
